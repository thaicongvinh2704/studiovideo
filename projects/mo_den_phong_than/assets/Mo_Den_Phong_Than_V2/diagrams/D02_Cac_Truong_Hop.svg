<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#233441"/></marker></defs><rect width="1920" height="1080" fill="#F7F1E4"/><text x="100" y="100" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#B78B42" text-anchor="start">MỎ ĐEN · PHONG THẦN DIỄN NGHĨA</text><text x="100" y="190" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="700" fill="#233441" text-anchor="start">MỖI THẦN VỊ, MỘT CUỘC ĐỜI</text><text x="100" y="254" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#233441" text-anchor="start">Đọc cả phẩm chất, lỗi lầm và công việc được giao trong sắc phong.</text><path d="M100 292H1820" stroke="#B78B42" stroke-width="3"/><rect x="100" y="340" width="1720" height="118" rx="28" fill="#FFFDF7" stroke="#233441" stroke-width="4"/><rect x="104" y="344" width="15" height="110" rx="7" fill="#476C83"/><text x="160" y="412" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#476C83" text-anchor="start">VĂN TRỌNG</text><text x="790" y="412" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#233441" text-anchor="start">Lòng tận trung được ghi nhận</text><rect x="100" y="486" width="1720" height="118" rx="28" fill="#FFFDF7" stroke="#233441" stroke-width="4"/><rect x="104" y="490" width="15" height="110" rx="7" fill="#9E5149"/><text x="160" y="558" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#9E5149" text-anchor="start">PHI LIÊM · ÁC LAI</text><text x="790" y="558" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#233441" text-anchor="start">Nhận chức, tội cũ vẫn bị đọc lại</text><rect x="100" y="632" width="1720" height="118" rx="28" fill="#FFFDF7" stroke="#233441" stroke-width="4"/><rect x="104" y="636" width="15" height="110" rx="7" fill="#476C83"/><text x="160" y="704" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#476C83" text-anchor="start">THÂN CÔNG BÁO</text><text x="790" y="704" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#233441" text-anchor="start">Chịu lời thề, rồi nhận phận sự</text><rect x="100" y="778" width="1720" height="118" rx="28" fill="#FFFDF7" stroke="#233441" stroke-width="4"/><rect x="104" y="782" width="15" height="110" rx="7" fill="#B78B42"/><text x="160" y="850" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#B78B42" text-anchor="start">TRIỆU CÔNG MINH</text><text x="790" y="850" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="400" fill="#233441" text-anchor="start">Có tôn phong, vẫn có mất mát</text><text x="100" y="1028" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#476C83" text-anchor="start">Phong Thần Diễn Nghĩa · Sơ đồ diễn giải tình tiết tác phẩm</text></svg>