<text x="65" y="70" font-family="Segoe UI" font-size="22" font-weight="400" fill="#168d83">BÀN VẼ STUDIO</text>
<text x="65" y="120" font-family="Segoe UI" font-size="34" font-weight="400" fill="#252b2d">Dựng hình. Chỉnh nét. Giữ phong cách.</text>
<text x="65" y="158" font-family="Segoe UI" font-size="18" font-weight="400" fill="#6c7774">Bài tập công cụ · vật thể vector · không phải mẫu nhân vật</text>
<text x="65" y="237" font-family="Segoe UI" font-size="18" font-weight="400" fill="#168d83">01 / SỬA ĐƯỜNG CONG</text>
<text x="65" y="605" font-family="Segoe UI" font-size="17" font-weight="400" fill="#6c7774">Chọn bình → Sửa nút → kéo điểm / tay nắm</text>
<text x="660" y="237" font-family="Segoe UI" font-size="18" font-weight="400" fill="#168d83">02 / DI CHUYỂN THEO MỐC</text>
<text x="660" y="605" font-family="Segoe UI" font-size="17" font-weight="400" fill="#6c7774">Chọn lớp Cụm gạch → Mốc → kéo “gach”</text>
<text x="65" y="680" font-family="Segoe UI" font-size="18" font-weight="400" fill="#6c7774">Cuộn để phóng to  •  Chuột giữa để kéo  •  F để vừa khung</text>
